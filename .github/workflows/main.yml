name: Build Knight Saver APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Packages
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip zip unzip libffi-dev libssl-dev

      - name: Install Build Tools
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Build APK (This will take 15-20 mins first time)
        run: |
          buildozer android debug

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Knight-Saver-APK-Ready-To-Sell
          path: bin/*.apk
