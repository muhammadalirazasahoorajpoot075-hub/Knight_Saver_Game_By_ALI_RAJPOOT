name: Build Knight Saver APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Fix Aidl & Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          echo "y" | buildozer android debug || true
          SDKMANAGER=$(find ~/.buildozer -name "sdkmanager" | head -n 1)
          echo "Found SDK at $SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          yes | $SDKMANAGER --sdk_root=$(dirname $(dirname $SDKMANAGER)))/.. "build-tools;33.0.2" "platform-tools" || true
          ls /home/runner/.buildozer/android/platform/android-sdk/build-tools/

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Knight-Saver-APK
          path: bin/*.apk
