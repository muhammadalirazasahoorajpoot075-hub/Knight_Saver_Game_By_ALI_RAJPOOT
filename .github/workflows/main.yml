name: Build Knight Saver APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Build APK
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # Pehle ek bar SDK download karne do
          buildozer android debug || true
          # Ab license accept karo aur 37 wala build-tools install karo
          SDKMANAGER=$(find ~/.buildozer -name sdkmanager | head -n 1)
          echo "Found: $SDKMANAGER"
          yes | $SDKMANAGER --licenses
          $SDKMANAGER --install "build-tools;37.0.0" "platform-tools"
          # Ab final build
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Knight-Saver-APK
          path: bin/*.apk
