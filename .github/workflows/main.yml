name: Build Knight Saver APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip zip unzip libffi-dev libssl-dev libbz2-dev libltdl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Fix Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer android debug || true
          SDK=$(find ~/.buildozer -name sdkmanager -type f | head -n 1)
          yes | $SDK --licenses || true
          yes | $SDK --sdk_root=/home/runner/.buildozer/android/platform/android-sdk "build-tools;33.0.2" "platform-tools" || true

      - name: Build Final APK
        run: |
          SDK=$(find ~/.buildozer -name sdkmanager -type f | head -n 1)
          yes | $SDK --licenses || true
          buildozer android debug

      - name: Upload APK or Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output
          path: |
            bin/
            .buildozer/logs/
