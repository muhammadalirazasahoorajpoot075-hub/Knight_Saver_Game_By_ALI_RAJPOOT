name: Build Knight Saver APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libffi-dev libssl-dev libbz2-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Build APK - Auto Fix
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # 1st run - SDK download karne ke liye (fail hoga to ignore)
          yes | buildozer android debug || true
          
          # Sahi wala sdkmanager ka rasta
          SDKMANAGER="$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "Using: $SDKMANAGER"
          chmod +x $SDKMANAGER
          
          # License accept + Build-tools 37 install
          yes | $SDKMANAGER --licenses
          $SDKMANAGER --install "build-tools;37.0.0" "build-tools;34.0.0" "platform-tools"
          
          # 2nd run - Final APK
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Knight-Saver-APK
          path: bin/*.apk
